name: Build Rhea sample dataset
on:
  push:
    branches: [feat/dsa-algorithm-lab]
    paths: [scripts/import-rhea.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RDKit
        run: python -m pip install rdkit
      - name: Download and normalize Rhea reactions
        run: python scripts/import-rhea.py --limit 1500 --output data/expanded
      - name: Commit generated dataset to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expanded/
          if ! git diff --cached --quiet; then
            git commit -m "data: add Rhea CC-BY-4.0 sample as an expanded graph"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
