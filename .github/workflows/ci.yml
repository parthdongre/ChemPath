name: ChemPath CI

on:
  push:
    branches: [main, midsem-build]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: Audit chemistry dataset
        run: npm run audit:chemistry

      - name: Build C++ engine
        run: npm run build:engine

      - name: Test C++ engine
        run: npm run test:engine

      - name: Test and benchmark optimized C++ build
        run: |
          cmake -S engine -B engine/build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build-release --config Release
          ctest --test-dir engine/build-release --output-on-failure -C Release
          ./engine/build-release/chempath_bench data/compounds.csv data/reactions.csv 96

      - name: Compare baseline and optimized engine
        run: bash scripts/compare-engine-baseline.sh

      - name: Smoke-test persistent API and laboratory routes
        run: node scripts/smoke-api.mjs

      - name: Verify optional ORD SQLite index and API
        run: node scripts/test-ord-api.mjs

      - name: Smoke-test optional expanded Rhea graph
        run: |
          if [ -f data/expanded/compounds.csv ]; then
            ./engine/build/chempath stats --data data/expanded
            ./engine/build/chempath labcomponents --data data/expanded > /dev/null
            ./engine/build/chempath labcsr 20 --data data/expanded
          fi

      - name: Verify bundled ORD teaching graph
        run: |
          if [ -f data/ord-demo/compounds.csv ]; then
            ./engine/build/chempath stats --data data/ord-demo > /tmp/ord-demo-stats.json
            node -e 'const x=require("/tmp/ord-demo-stats.json"); if(x.compounds<10000||x.reactions<5000||x.directedEdges<10000) process.exit(1);console.log("ORD graph verified",x.compounds,x.reactions,x.directedEdges)'
          fi

      - name: Build frontend
        run: npm run build:web

      - name: Verify single-origin production server
        run: node scripts/smoke-production.mjs

      - name: Smoke-test CLI
        run: |
          ./engine/build/chempath stats
          ./engine/build/chempath path Methane Bicarbonate
          ./engine/build/chempath search meth
